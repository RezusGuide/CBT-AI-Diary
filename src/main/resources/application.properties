spring.application.name=diploma

# Dynamic port for Railway
server.port=${PORT:8080}

# Database configuration using environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-shy-cherry-ap45f23z.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_V4SoETpd8rQj}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=1024
spring.ai.openai.embedding.enabled=false

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# JWT
jwt.secret=b64f9b8c7d6e5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# 2FA email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_APP_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.datasource.hikari.connection-timeout=30000
app.2fa.otp-expiry-minutes=10

